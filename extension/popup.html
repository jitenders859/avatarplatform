<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AvatarPlatform Live Handoff</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px;
    margin: 0;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c22; color: #eee; }
    input { background: #2a2a33 !important; color: #eee !important; border-color: #3a3a45 !important; }
    .row { border-color: #33333d !important; }
    .muted { color: #9a9aa5 !important; }
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid rgba(127,127,127,.2);
  }
  header img { width: 20px; height: 20px; }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; }
  main { padding: 14px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; opacity: .75; }
  input {
    width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 6px; background: #fafafa; color: #1a1a1a;
  }
  button {
    width: 100%; padding: 8px; font-size: 13px; font-weight: 600; border: none;
    border-radius: 6px; background: #7c6af5; color: #fff; cursor: pointer; margin-top: 4px;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { background: transparent; color: #7c6af5; border: 1px solid #7c6af5; }
  .error { color: #e0563f; font-size: 12px; margin-top: 8px; min-height: 14px; }
  .muted { color: #777; font-size: 11px; }
  .user-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid rgba(127,127,127,.15);
  }
  .row:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex: none; }
  .dot.on { background: #35b26b; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
    background: #e0563f; color: #fff; min-width: 14px; text-align: center;
  }
  .empty { padding: 16px 0; text-align: center; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { margin-top: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" />
    <h1>Live Handoff</h1>
  </header>

  <main>
    <section id="login-view">
      <div class="field">
        <label for="server-url">Server URL</label>
        <input id="server-url" type="text" placeholder="https://your-app.example.com" autocomplete="url" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <button id="login-btn" type="button">Log in</button>
      <div class="error" id="login-error"></div>
    </section>

    <section id="status-view" hidden>
      <div class="user-row">
        <span class="muted" id="user-email"></span>
        <button class="secondary" id="logout-btn" type="button" style="width:auto;padding:4px 10px">Log out</button>
      </div>
      <div id="projects-list"></div>
      <div class="actions">
        <button class="secondary" id="refresh-btn" type="button">Refresh</button>
        <button id="open-dashboard-btn" type="button">Open dashboard</button>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
