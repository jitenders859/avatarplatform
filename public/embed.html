<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/embed.css" />
  <script src="https://unpkg.com/@rive-app/canvas@2.21.0/rive.js"></script>
  <!-- lipsync-sdk.min.js is gitignored — a fresh clone/deploy only has it
       once `npm run build` (postinstall) has actually run terser. If that
       ever fails silently, falling back to the unminified source here
       keeps every customer's widget from going dark, at the cost of a
       slightly bigger download. onerror fires synchronously as the parser
       reaches this node, so document.write here still inserts before the
       rest of the page parses — the classic script-fallback pattern. -->
  <script src="/lipsync-sdk.min.js" onerror="document.write('<scr' + 'ipt src=\'/lipsync-sdk.js\'></scr' + 'ipt>')"></script>
</head>
<body>
  <!--
    LAYOUT
    ───────────────────────────────────────────────────
    .widget-root           positioned shell (floating modes only; inline mode is full-bleed)
      .launcher            FAB visible when minimized; Rive avatar inside
      .panel               chat panel
        .header            name + status + minimize (no avatar here)
        .body              messages list (scrollable)
        .avatar-row        Rive avatar stage, sits above composer in flex flow
        .composer          mic + textarea + send
        .branding

    The Rive canvas is a single element that shuttles between the launcher
    slot (when minimized) and the avatar-row slot (when open), driven by
    openPanel() / closePanel(). No duplicate Rive instances needed.
  -->

  <div class="widget-root" id="root" data-position="bottom-right" data-state="loading" hidden>
    <!-- Launcher (visible when minimized) -->
    <button class="launcher" id="launcher" aria-label="Open chat" aria-expanded="false" type="button">
      <div class="launcher-avatar-slot" id="launcher-avatar-slot"></div>
      <span class="launcher-fallback" id="launcher-fallback">💬</span>
      <span class="launcher-pulse" aria-hidden="true"></span>
      <span class="launcher-badge" id="launcher-badge" hidden>1</span>
    </button>

    <!-- Panel (visible when open) -->
    <section class="panel" id="panel" role="dialog" aria-label="Chat with assistant">
      <header class="header" id="header">
        <div class="header-text">
          <div class="header-name" id="bot-name">Assistant</div>
          <div class="header-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting…</span>
            <span id="capture-pill" style="display:none;margin-left:8px;font-size:10px;background:rgba(var(--text-rgb),.15);border-radius:10px;padding:2px 7px;letter-spacing:.02em"></span>
          </div>
        </div>
        <button class="icon-btn" id="handoff-btn" title="Talk to a human" aria-label="Talk to a human" hidden type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>
        <button class="icon-btn" id="fullscreen-btn" title="Full screen" aria-label="Full screen" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
        <button class="icon-btn" id="minimize-btn" title="Minimize" aria-label="Minimize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
      </header>

      <div class="body" id="messages" role="log" aria-live="polite"></div>

      <!-- Avatar row: large Rive character above the composer -->
      <div class="avatar-row" id="avatar-row">
        <div class="avatar-stage" id="avatar-canvas-slot">
          <!-- Canvas reparented here by JS once SDK builds it -->
        </div>
      </div>

      <div class="composer">
        <button class="icon-btn mic-btn" id="mic-btn" title="Hold to speak" aria-label="Microphone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 1 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        </button>
        <button class="icon-btn" id="image-btn" title="Upload an image" aria-label="Upload an image" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" style="display:none" />
        <button class="icon-btn" id="quiz-btn" title="Quiz me on this" aria-label="Quiz me" style="display:none">📝</button>
        <button class="icon-btn" id="progress-btn" title="Your progress" aria-label="Your progress" style="display:none">📊</button>
        <textarea id="text-input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea>
        <button class="send-btn" id="send-btn" title="Send" aria-label="Send" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>

      <!-- Collapsible "Your details" panel -->
      <div id="details-panel" style="display:none;border-top:1px solid rgba(var(--text-rgb),.12);padding:8px 12px 4px;background:rgba(0,0,0,.15)">
        <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0 6px" onclick="toggleDetailsPanel()">
          <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.7">Your details</span>
          <span id="details-chevron" style="font-size:10px;opacity:.6">▲</span>
        </div>
        <div id="details-body" style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px"></div>
      </div>
      <div class="branding" id="branding">Powered by AvatarPlatform</div>
    </section>
  </div>

  <!-- Full-size image viewer, opened by clicking a chat thumbnail -->
  <div class="image-lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close" type="button">✕</button>
    <img id="lightbox-img" alt="Uploaded image" />
  </div>

  <!-- Off-screen host the SDK uses to build its canvas before we reparent it -->
  <div id="sdk-host" style="position:fixed;left:-99999px;top:-99999px;width:300px;height:300px;"></div>

  <!-- Loading skeleton -->
  <div class="boot-overlay" id="boot-overlay">
    <div class="boot-skeleton">
      <div class="skel-circle pulse"></div>
      <div class="skel-lines">
        <div class="skel-line pulse" style="width:60%"></div>
        <div class="skel-line pulse" style="width:80%"></div>
      </div>
    </div>
  </div>

  <script>
  /* eslint-disable no-undef */
  // ── Boot ─────────────────────────────────────────────────────
  const path = location.pathname;
  const m = path.match(/\/e\/([a-zA-Z0-9_-]+)/);
  const publicId = m ? m[1] : new URLSearchParams(location.search).get('bot');
  if (!publicId) { showFatal('Missing chatbot ID'); }

  const urlMode = new URLSearchParams(location.search).get('mode');

  let avatar = null;
  let config = null;
  let sessionId = null;
  let pendingSources = null;
  let pendingFigures = null;
  let pendingOptions = null;
  let sessionCapture = {};
  let captureFields = [];
  let saveLeadTimer = null;
  let currentBotMsgEl = null;
  let currentUserMsgEl = null;
  let lastUserFinal = '';
  let unreadCount = 0;
  let panelOpen = true;
  let fullscreenActive = false;
  let avatarCanvas = null;   // single Rive canvas element shuttled between slots
  let textOnly = false;      // true when no voice key (server answers via /ask)
  let handoffWs = null;
  let handoffState = 'none'; // 'none' | 'connecting' | 'waiting' | 'active'
  let handoffReconnectAttempts = 0;

  const AVATAR_SIZES = { small: 80, medium: 120, large: 160, xlarge: 200 };

  const root              = document.getElementById('root');
  const panel             = document.getElementById('panel');
  const launcher          = document.getElementById('launcher');
  const launcherBadge     = document.getElementById('launcher-badge');
  const launcherAvatarSlot= document.getElementById('launcher-avatar-slot');
  const launcherFallback  = document.getElementById('launcher-fallback');
  const messagesEl        = document.getElementById('messages');
  const statusDot         = document.getElementById('status-dot');
  const statusText        = document.getElementById('status-text');
  const sendBtn           = document.getElementById('send-btn');
  const micBtn            = document.getElementById('mic-btn');
  const imageBtn           = document.getElementById('image-btn');
  const imageInput         = document.getElementById('image-input');
  const imageLightbox      = document.getElementById('image-lightbox');
  const lightboxImg        = document.getElementById('lightbox-img');
  const lightboxClose      = document.getElementById('lightbox-close');
  const quizBtn           = document.getElementById('quiz-btn');
  const progressBtn       = document.getElementById('progress-btn');
  const textInput         = document.getElementById('text-input');
  const minimizeBtn       = document.getElementById('minimize-btn');
  const handoffBtn         = document.getElementById('handoff-btn');
  const fullscreenBtn     = document.getElementById('fullscreen-btn');
  const bootOverlay       = document.getElementById('boot-overlay');
  const branding          = document.getElementById('branding');
  const avatarRow         = document.getElementById('avatar-row');
  const avatarCanvasSlot  = document.getElementById('avatar-canvas-slot');

  // ── 1. Fetch config ─────────────────────────────────────────
  async function boot() {
    try {
      const res = await fetch(`/embed/${publicId}/config`);
      if (!res.ok) throw new Error(`Failed to load chatbot (${res.status})`);
      config = await res.json();
    } catch (e) { showFatal(e.message); return; }

    document.getElementById('bot-name').textContent = config.project.name;
    document.title = config.project.name;

    if (config.widgetMessages && config.widgetMessages.inputPlaceholder) {
      textInput.placeholder = config.widgetMessages.inputPlaceholder;
    }

    if (config.project.themeColor) {
      document.documentElement.style.setProperty('--accent', config.project.themeColor);
    }
    document.documentElement.dataset.theme = config.project.widgetTheme || 'light';

    const position = urlMode === 'inline' ? 'inline' : (config.project.widgetPosition || 'bottom-right');
    root.dataset.position = position;
    if (position === 'inline') document.body.classList.add('mode-inline');

    applyDirection(config.project.textDirection || 'auto');
    if (!config.project.showBranding) branding.style.display = 'none';
    if (config.project.capabilityTier === 'advanced') {
      quizBtn.style.display = '';
      progressBtn.style.display = '';
    }

    // Full-screen mode: desktop/mobile decided by pointer type, not
    // viewport width — the iframe's own rendered box is small (≤400px)
    // regardless of the host device, so a width check would always
    // read "mobile". Not applicable to 'inline' (already full-bleed).
    if (position !== 'inline') {
      const isMobileDevice = window.matchMedia('(pointer: coarse)').matches;
      fullscreenActive = isMobileDevice
        ? !!config.project.fullScreenOnMobile
        : !!config.project.fullScreenOnDesktop;
      root.dataset.fullscreen = fullscreenActive ? '1' : '0';
      if (config.project.showFullScreenToggle) {
        fullscreenBtn.hidden = false;
        updateFullscreenIcon();
      }
    }

    if (config.handoffEnabled) {
      handoffBtn.hidden = false;
    }

    // Avatar placement settings
    const avatarSize = config.project.avatarSize || 'large';
    const avatarSizePx = AVATAR_SIZES[avatarSize] || 160;
    const avatarPos = config.project.avatarPosition || 'right';
    const compactMobile = config.project.avatarCompactOnMobile !== false;

    document.documentElement.style.setProperty('--avatar-size', avatarSizePx + 'px');
    panel.dataset.avatarPos = avatarPos;
    if (compactMobile) panel.dataset.compactMobile = '1';

    // Apply launcher size: make launcher larger when showing avatar
    if (config.project.showAvatarInLauncher !== false) {
      const launcherSz = Math.max(64, Math.min(avatarSizePx, 88));
      document.documentElement.style.setProperty('--launcher-size', launcherSz + 'px');
      launcher.classList.add('has-avatar');
    }

    if (config.limitReached) { showFatal(config.limitMessage || 'This assistant has reached its usage limit for this month. Please check back later.'); return; }

    // No voice key issued by the server (PUBLIC_GEMINI_API_KEY unset, or the
    // owner's quota was exhausted between config load and now). Degrade to
    // text-only mode: the server answers typed questions through POST /ask,
    // so the widget stays fully usable — just without the talking avatar.
    if (!config.apiKey) { initTextMode(); return; }

    initSDK();
  }

  function applyDirection(setting) {
    let dir = setting;
    if (setting === 'auto') {
      dir = detectDirection(config.project.welcomeMessage || '') || 'ltr';
    }
    document.documentElement.dir = dir;
    // detectDirection only answers rtl-or-not (RTL_REGEX below spans several
    // scripts); claiming lang="ar" for all of them mislabels Hebrew, Syriac,
    // Thaana, and NKo text. detectScriptLang narrows to the two scripts we
    // can actually tell apart, and gives up (empty lang) rather than guess
    // for the rest — an absent/empty lang is honest, a wrong one isn't.
    document.documentElement.lang = dir === 'rtl' ? (detectScriptLang(config.project.welcomeMessage || '') || '') : 'en';
  }

  function updateFullscreenIcon() {
    fullscreenBtn.innerHTML = fullscreenActive
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M9 21v-4a2 2 0 0 0-2-2H3M15 21v-4a2 2 0 0 1 2-2h4"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
    fullscreenBtn.title = fullscreenActive ? 'Exit full screen' : 'Full screen';
    fullscreenBtn.setAttribute('aria-label', fullscreenBtn.title);
  }

  const RTL_REGEX = /[֐-׿؀-ۿ܀-ݏހ-޿߀-߿ﭐ-﷿ﹰ-﻿]/;
  function detectDirection(text) {
    if (!text) return null;
    return RTL_REGEX.test(text) ? 'rtl' : 'ltr';
  }

  // Narrower than RTL_REGEX — only the two scripts common enough here to
  // label with confidence. Syriac/Thaana/NKo text is still detected as
  // RTL by RTL_REGEX (direction is still correct), it just doesn't get a
  // specific lang claim.
  const HEBREW_REGEX = /[֐-׿]/;
  const ARABIC_REGEX = /[؀-ۿﭐ-﷿ﹰ-﻿]/;
  function detectScriptLang(text) {
    if (!text) return null;
    if (HEBREW_REGEX.test(text)) return 'he';
    if (ARABIC_REGEX.test(text)) return 'ar';
    return null;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // ── 2. SDK init ─────────────────────────────────────────────
  function initSDK() {
    const GREET_TRIGGER = '__GREET_USER_NOW__';
    const welcomeMessage = (config.project.welcomeMessage || '').trim();

    captureFields = config.captureFields || [];
    const baseSystemPrompt = (config.project.systemPrompt || '')
      + buildKnowledgeBaseToolInstructions()
      + buildCaptureInstructions(captureFields)
      + buildQuickReplyInstructions(config.project.showQuickReplies)
      + buildHandoffInstructions(config.handoffEnabled);
    const systemPromptWithGreeting = welcomeMessage
      ? `${baseSystemPrompt}

GREETING INSTRUCTION: When (and only when) you receive the exact message "${GREET_TRIGGER}", respond by speaking this greeting verbatim and nothing else: "${welcomeMessage}". Do not acknowledge the trigger token, do not add any other words. For all other messages, ignore this instruction and respond normally.`
      : baseSystemPrompt;

    avatar = new LipsyncAvatar({
      container:    '#sdk-host',
      riveSrc:      config.character.rivePath,
      apiKey:       config.apiKey,
      model:        config.model,
      voice:        config.project.voice,
      systemPrompt: systemPromptWithGreeting,

      showVoiceSelect: false, showTranscript: false,
      showTextInput: false,   showBands: false,
      width: 300, height: 300,
      enableBehavior: true,
      // Idle breathing/head-tilt/eye-drift is decorative, ambient motion —
      // lip-sync itself stays at full strength since that's the widget's
      // actual function, not something prefers-reduced-motion is about.
      ...(prefersReducedMotion() ? { behaviorConfig: { idleIntensity: 0 } } : {}),
      characterTriggers: config.character?.triggers || [],
      tools: [searchKnowledgeBaseTool()],

      onConnected: () => {
        statusDot.className = 'status-dot connected';
        statusText.textContent = 'Online';
      },
      onDisconnected: () => {
        statusDot.className = 'status-dot';
        statusText.textContent = 'Offline';
      },
      onError: (msg) => { console.warn('[avatar]', msg); },
      onTranscript: (role, text) => {
        if (role === 'model') handleBotChunk(text);
        else if (role === 'user') handleUserChunk(text);
      },
    });

    // Reparent canvas once SDK builds it
    waitForCanvas(canvas => {
      avatarCanvas = canvas;
      Object.assign(canvas.style, { width: '100%', height: '100%', display: 'block', borderRadius: '12px' });
      // Initial placement: avatar-row slot (panel will be open or we'll move it on close)
      avatarCanvasSlot.appendChild(canvas);
      launcherFallback.style.display = 'none';
    });

    const startOpen = !!config.project.widgetStartOpen;

    if (welcomeMessage) {
      avatar.connect();
      waitForConnected(() => {
        currentBotMsgEl = addMessage('bot', '', { welcome: true });
        avatar.sendText(GREET_TRIGGER);
        finishBoot(startOpen);
      });
    } else {
      finishBoot(startOpen);
    }
  }

  // ── 2b. Text-only mode (no voice key from the server) ────────────
  // Kicks in when /config returns no apiKey (PUBLIC_GEMINI_API_KEY is
  // intentionally unset on the server — voice needs a browser-facing key and
  // we never ship the server key out). Everything typed is answered by the
  // server-side POST /ask RAG path; the avatar canvas and voice/image/mic
  // affordances are simply not available.
  function initTextMode() {
    textOnly = true;
    captureFields = config.captureFields || [];

    micBtn.style.display = 'none';
    imageBtn.style.display = 'none';
    imageInput.style.display = 'none';
    document.getElementById('avatar-row').style.display = 'none';
    launcherFallback.style.display = '';

    statusDot.className = 'status-dot connected';
    statusText.textContent = 'Text mode';

    if (config.project.welcomeMessage) {
      addMessage('bot', config.project.welcomeMessage, { welcome: true });
    }
    finishBoot(!!config.project.widgetStartOpen);
  }

  async function sendTextOnly(text) {
    addMessage('user', text);
    textInput.value = '';
    textInput.style.height = 'auto';
    sendBtn.disabled = true;
    statusText.textContent = 'Thinking…';

    try {
      const res = await fetch(`/embed/${publicId}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text, sessionId }),
      });

      if (res.status === 429) {
        addMessage('bot', '⚠️ Slow down a bit — too many messages in a short time.');
        return;
      }

      const data = await res.json().catch(() => ({}));

      if (res.status === 402 || data.limitReached) {
        addMessage('bot', data.limitMessage || data.error || 'This assistant has reached its usage limit for this month. Please check back later.');
        return;
      }
      if (!res.ok) {
        addMessage('bot', data.error || 'Something went wrong — please try again in a moment.');
        return;
      }

      if (data.sessionId) sessionId = data.sessionId;
      notifyParent({ type: 'message', sessionId, role: 'user', text });

      const answerEl = addMessage('bot', data.answer || '…');
      if (config.project.showSourceCards !== false && data.sources && data.sources.length) {
        attachSources(answerEl, data.sources.map(s => ({
          fileId: null, fileName: s.title, kind: s.url ? 'url' : null, url: s.url || null, previewUrl: null,
        })));
      }
      notifyParent({ type: 'response', sessionId, answer: data.answer || '', sources: data.sources || [] });
      if (data.offerHandoff && config.handoffEnabled) {
        const el = document.createElement('div');
        el.className = 'msg system';
        el.style.cssText = 'align-self:stretch;max-width:100%;background:var(--bot-bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px';
        el.innerHTML = `<span style="font-size:13px">Want me to connect you with a human?</span><button type="button" style="padding:6px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer">Yes, please</button>`;
        el.querySelector('button').addEventListener('click', () => { el.remove(); requestHandoff(); });
        messagesEl.appendChild(el);
        requestAnimationFrame(() => el.classList.add('visible'));
        scrollToBottom();
      }
      // No logTurn here: /ask already persists both turns + bumped the
      // message counter server-side; hitting /log too would double-count.
      // The ap:message/ap:response host events above are independent of
      // that persistence, so they still fire on this path.
    } catch (e) {
      addMessage('bot', 'Something went wrong — please try again in a moment.');
    } finally {
      sendBtn.disabled = false;
      statusText.textContent = 'Text mode';
    }
  }

  // ── Human handoff ────────────────────────────────────────────
  function wsUrl(path) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    return `${proto}://${location.host}${path}`;
  }

  function requestHandoff() {
    if (handoffState !== 'none') return;
    if (avatar && !textOnly) {
      avatar.disconnect();
      document.getElementById('avatar-row').style.display = 'none';
    }
    handoffState = 'connecting';
    addMessage('bot', 'Connecting you with a team member…', { welcome: false });
    const url = sessionId
      ? wsUrl(`/ws/embed/${publicId}?sessionId=${encodeURIComponent(sessionId)}`)
      : wsUrl(`/ws/embed/${publicId}`);
    openHandoffSocket(url);
  }

  function openHandoffSocket(url) {
    handoffWs = new WebSocket(url);

    handoffWs.addEventListener('open', () => {
      handoffReconnectAttempts = 0;
      if (handoffState === 'connecting') {
        handoffWs.send(JSON.stringify({ type: 'request_handoff' }));
      }
    });

    handoffWs.addEventListener('message', (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleHandoffMessage(msg);
    });

    handoffWs.addEventListener('close', () => {
      if (handoffState === 'active' || handoffState === 'waiting') {
        if (handoffReconnectAttempts < 5) {
          const delay = Math.min(1000 * Math.pow(2, handoffReconnectAttempts++), 15000);
          setTimeout(() => openHandoffSocket(wsUrl(`/ws/embed/${publicId}?sessionId=${encodeURIComponent(sessionId)}`)), delay);
        } else {
          addMessage('system', 'Connection lost — please refresh to reconnect.');
        }
      }
    });
  }

  function handleHandoffMessage(msg) {
    if (msg.type === 'connected') {
      sessionId = msg.sessionId;
      return;
    }
    if (msg.type === 'waiting') {
      handoffState = 'waiting';
      statusText.textContent = 'Waiting for a team member…';
      return;
    }
    if (msg.type === 'no_one_available') {
      handoffState = 'none';
      showHandoffCaptureForm();
      return;
    }
    if (msg.type === 'claimed') {
      handoffState = 'active';
      statusText.textContent = `Chatting with ${msg.byName}`;
      addMessage('system', `You're now chatting with ${msg.byName}.`);
      return;
    }
    if (msg.type === 'chat' && msg.from === 'human') {
      const el = addMessage('human', msg.text);
      el.dataset.byName = msg.byName || '';
      return;
    }
    if (msg.type === 'resolved') {
      handoffState = 'none';
      statusText.textContent = textOnly ? 'Text mode' : 'Online';
      addMessage('system', "You're back with the AI assistant.");
    }
  }

  function sendHandoffChat(text) {
    if (!handoffWs || handoffWs.readyState !== WebSocket.OPEN) return;
    handoffWs.send(JSON.stringify({ type: 'chat', text }));
    addMessage('user', text);
  }

  function showHandoffCaptureForm() {
    const el = document.createElement('div');
    el.className = 'msg system';
    el.style.cssText = 'align-self:stretch;max-width:100%;text-align:left;background:var(--bot-bg);border-radius:12px;padding:12px';
    el.innerHTML = `
      <p style="margin:0 0 8px;font-size:13px">No one's available right now — leave your info and we'll follow up.</p>
      <input type="text" placeholder="Your name" class="input" id="handoff-capture-name" style="width:100%;margin-bottom:6px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:13px" />
      <input type="email" placeholder="Your email" class="input" id="handoff-capture-email" style="width:100%;margin-bottom:8px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:13px" />
      <button type="button" id="handoff-capture-submit" style="width:100%;padding:8px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer">Send</button>
    `;
    messagesEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add('visible'));
    scrollToBottom();

    document.getElementById('handoff-capture-submit').addEventListener('click', async () => {
      const name = document.getElementById('handoff-capture-name').value.trim();
      const email = document.getElementById('handoff-capture-email').value.trim();
      if (!email) return;
      try {
        await fetch(`/embed/${publicId}/lead`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, data: { name, email }, complete: true }),
        });
        el.innerHTML = '<p style="margin:0;font-size:13px">Thanks — we\'ll be in touch.</p>';
      } catch {
        el.querySelector('p').textContent = 'Something went wrong — please try again.';
      }
    });
  }

  function waitForCanvas(cb, attempts = 60) {
    const host = document.getElementById('sdk-host');
    const canvas = host && host.querySelector('canvas');
    if (canvas) return cb(canvas);
    if (attempts <= 0) return;
    setTimeout(() => waitForCanvas(cb, attempts - 1), 80);
  }

  function waitForConnected(cb, attempts = 80) {
    if (statusDot.classList.contains('connected')) return cb();
    if (attempts <= 0) { console.warn('[avatar] connect timeout'); return cb(); }
    setTimeout(() => waitForConnected(cb, attempts - 1), 100);
  }

  function finishBoot(startOpen) {
    bootOverlay.classList.add('fade-out');
    setTimeout(() => bootOverlay.remove(), 300);
    root.hidden = false;
    root.dataset.state = 'ready';
    if (root.dataset.position === 'inline' || startOpen) {
      openPanel();
    } else {
      closePanel(true);
    }
    setupDrag();
    setupImageDragDrop();
    notifyParent({ type: 'ready' });
  }

  // ── Drag-to-reposition ─────────────────────────────────────────
  function setupDrag() {
    if (root.dataset.position === 'inline') return;
    if (window.matchMedia('(pointer: coarse)').matches) return;

    root.classList.add('draggable');

    const headerEl = document.getElementById('header');
    const minBtn   = document.getElementById('minimize-btn');
    const fsBtn    = document.getElementById('fullscreen-btn');

    headerEl.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (minBtn.contains(e.target) || fsBtn.contains(e.target)) return;
      if (root.dataset.fullscreen === '1') return;
      headerEl.style.cursor = 'grabbing';
      notifyParent({ type: 'drag-start' });
    });
  }

  // ── Drag-and-drop image upload (opt-in per project) ────────────
  function setupImageDragDrop() {
    if (!config.project.allowDragDropUpload) return;
    let dragDepth = 0;
    const hasFiles = e => e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files');

    root.addEventListener('dragenter', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragDepth++;
      root.classList.add('drag-over-image');
    });
    root.addEventListener('dragover', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
    });
    root.addEventListener('dragleave', e => {
      if (!hasFiles(e)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) root.classList.remove('drag-over-image');
    });
    root.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragDepth = 0;
      root.classList.remove('drag-over-image');
      const file = e.dataTransfer.files[0];
      if (file) handleImageFile(file);
    });
  }

  // ── 3. Sending messages ─────────────────────────────────────
  // Sends straight into the persistent Live session — retrieval now
  // happens on demand via the search_knowledge_base tool (see
  // searchKnowledgeBaseTool() above) instead of reconnecting the session
  // on every message. That old reconnect-per-message approach also meant
  // the AI silently lost the whole conversation so far each time (a fresh
  // Live session carries no memory of the one it replaced); this keeps one
  // session running for as long as the visitor stays connected, same as
  // the mic/voice path already did.
  function sendMessage(text) {
    text = (text || '').trim();
    if (!text) return;
    if (handoffState === 'active') { sendHandoffChat(text); textInput.value = ''; textInput.style.height = 'auto'; return; }
    if (textOnly) return sendTextOnly(text);

    addMessage('user', text);
    textInput.value = '';
    textInput.style.height = 'auto';
    sendBtn.disabled = true;

    const proceed = () => {
      currentBotMsgEl = addMessage('bot', '');
      avatar.sendText(text);
      sendBtn.disabled = false;
      logTurn('user', text);
    };

    avatar.connect();
    waitForConnected(proceed);
  }

  // ── Image upload ──────────────────────────────────────────────
  const ALLOWED_IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
  const MAX_IMAGE_DIM = 1600;
  const MAX_IMAGE_BYTES = 5 * 1024 * 1024;

  function loadImageFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image file.')); };
      img.src = url;
    });
  }

  async function prepareImageForSend(file) {
    if (!file) throw new Error('No file selected.');
    if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
      throw new Error('Please upload a JPEG, PNG, or WEBP image.');
    }

    const img = await loadImageFile(file);
    const longEdge = Math.max(img.width, img.height);
    const scale = longEdge > MAX_IMAGE_DIM ? MAX_IMAGE_DIM / longEdge : 1;
    const targetW = Math.max(1, Math.round(img.width * scale));
    const targetH = Math.max(1, Math.round(img.height * scale));

    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    canvas.getContext('2d').drawImage(img, 0, 0, targetW, targetH);

    let quality = 0.85;
    let dataUrl = canvas.toDataURL('image/jpeg', quality);
    while (dataUrl.length * 0.75 > MAX_IMAGE_BYTES && quality > 0.4) {
      quality -= 0.15;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    if (dataUrl.length * 0.75 > MAX_IMAGE_BYTES) {
      throw new Error('That image is too large even after compression — try a smaller photo.');
    }

    return { base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', dataUrl };
  }

  function addImageMessage(dataUrl) {
    const el = document.createElement('div');
    el.className = 'msg user image-msg';
    const img = document.createElement('img');
    img.className = 'image-thumb';
    img.src = dataUrl;
    img.alt = 'Uploaded image';
    img.addEventListener('click', () => openLightbox(dataUrl));
    el.appendChild(img);
    messagesEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add('visible'));
    scrollToBottom();
    return el;
  }

  let lightboxOpenerEl = null;
  function openLightbox(src) {
    lightboxOpenerEl = document.activeElement;
    lightboxImg.src = src;
    imageLightbox.hidden = false;
    lightboxClose.focus();
  }

  function closeLightbox() {
    imageLightbox.hidden = true;
    if (lightboxOpenerEl && document.contains(lightboxOpenerEl)) lightboxOpenerEl.focus();
    lightboxOpenerEl = null;
  }

  lightboxClose.addEventListener('click', closeLightbox);
  imageLightbox.addEventListener('click', (e) => {
    if (e.target === imageLightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (imageLightbox.hidden) return;
    if (e.key === 'Escape') { closeLightbox(); return; }
    // Focus trap: lightbox-close is the only focusable control in the
    // dialog today, so trapping just means Tab/Shift+Tab never leave it.
    if (e.key === 'Tab') { e.preventDefault(); lightboxClose.focus(); }
  });

  let imageUploadInFlight = false;
  async function handleImageFile(file) {
    if (imageUploadInFlight) return;
    imageUploadInFlight = true;

    let prepared;
    try {
      prepared = await prepareImageForSend(file);
    } catch (e) {
      addMessage('bot', `⚠️ ${e.message}`);
      imageUploadInFlight = false;
      return;
    }

    const bubble = addImageMessage(prepared.dataUrl);
    const alreadyConnected = statusDot.classList.contains('connected');
    if (!alreadyConnected) bubble.classList.add('sending');

    const send = () => {
      bubble.classList.remove('sending');
      try {
        avatar.sendImage(prepared.base64, prepared.mimeType);
        logTurn('user', '[Image shared]');
      } catch (e) {
        addMessage('bot', '⚠️ Could not send the image — try again once the chat has started.');
      } finally {
        imageUploadInFlight = false;
      }
    };

    if (!statusDot.classList.contains('connected')) {
      avatar.connect();
      waitForConnected(send);
    } else {
      send();
    }
  }

  // ── 4. Streaming bot replies ────────────────────────────────
  let botBuffer = '';
  let botFlushTimer = null;
  const HANDOFF_TAG_RE = /\[\[REQUEST_HUMAN\]\]/g;
  function extractHandoffTag(text) {
    let requested = false;
    const clean = text.replace(HANDOFF_TAG_RE, () => { requested = true; return ''; });
    return { clean, requested };
  }

  function handleBotChunk(text) {
    const { clean: cleanCapture, tags } = extractCaptureTags(text);
    const { clean: cleanOptions, options } = extractOptionsTag(cleanCapture);
    const { clean, requested: handoffRequested } = extractHandoffTag(cleanOptions);
    if (handoffRequested && config.handoffEnabled) requestHandoff();
    if (tags.length) {
      for (const { key, value } of tags) sessionCapture[key] = value;
      scheduleSaveLead();
      updateCapturePanel();
    }
    pendingOptions = options;

    if (!currentBotMsgEl) currentBotMsgEl = addMessage('bot', '');
    setMessageText(currentBotMsgEl, clean);
    botBuffer = clean;
    scrollToBottom();
    if (!panelOpen) bumpUnread();

    clearTimeout(botFlushTimer);
    botFlushTimer = setTimeout(() => {
      if (pendingSources && pendingSources.length && currentBotMsgEl) {
        attachSources(currentBotMsgEl, pendingSources);
        pendingSources = null;
      }
      if (pendingFigures && pendingFigures.length) {
        for (const fig of pendingFigures) renderFigureCard(fig);
        pendingFigures = null;
      }
      if (config.project.showQuickReplies && pendingOptions && currentBotMsgEl) {
        attachOptionButtons(currentBotMsgEl, pendingOptions);
      }
      pendingOptions = null;
      if (botBuffer) logTurn('assistant', botBuffer);
      botBuffer = '';
      currentBotMsgEl = null;
    }, 1500);
  }

  let userFlushTimer = null;
  function handleUserChunk(text) {
    if (text === '__GREET_USER_NOW__') return;

    if (!currentUserMsgEl) {
      currentUserMsgEl = addMessage('user', '', { interim: true });
    }
    setMessageText(currentUserMsgEl, text);
    scrollToBottom();

    clearTimeout(userFlushTimer);
    userFlushTimer = setTimeout(() => {
      if (currentUserMsgEl) {
        currentUserMsgEl.classList.remove('interim');
        if (text && text !== lastUserFinal) {
          lastUserFinal = text;
          logTurn('user', text);
        }
        currentUserMsgEl = null;
      }
    }, 1200);
  }

  // ── 5. DOM helpers ──────────────────────────────────────────
  function addMessage(role, text, opts = {}) {
    const el = document.createElement('div');
    el.className = `msg ${role}`
      + (opts.welcome ? ' welcome' : '')
      + (opts.interim ? ' interim' : '');
    setMessageText(el, text);
    messagesEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add('visible'));
    scrollToBottom();
    return el;
  }

  function setMessageText(el, text) {
    el.innerHTML = '';
    if (!text) return;
    const paragraphs = String(text).split(/\n{2,}/);
    for (const para of paragraphs) {
      const p = document.createElement('p');
      const lines = para.split('\n');
      lines.forEach((line, i) => {
        if (i > 0) p.appendChild(document.createElement('br'));
        appendInlineFormatted(p, line);
      });
      el.appendChild(p);
    }
  }

  function appendInlineFormatted(parent, text) {
    const urlRe = /(https?:\/\/[^\s<>"']+)/g;
    let lastIndex = 0;
    let m;
    while ((m = urlRe.exec(text)) !== null) {
      if (m.index > lastIndex) appendStyled(parent, text.slice(lastIndex, m.index));
      const a = document.createElement('a');
      a.href = m[0]; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = m[0];
      parent.appendChild(a);
      lastIndex = m.index + m[0].length;
    }
    if (lastIndex < text.length) appendStyled(parent, text.slice(lastIndex));
  }

  function appendStyled(parent, text) {
    const re = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      const tok = m[0];
      if (tok.startsWith('**')) {
        const b = document.createElement('strong'); b.textContent = tok.slice(2, -2); parent.appendChild(b);
      } else {
        const i = document.createElement('em'); i.textContent = tok.slice(1, -1); parent.appendChild(i);
      }
      last = m.index + tok.length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function attachSources(afterEl, sources) {
    if (!sources.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'sources';
    for (const s of sources) {
      // Click-through target: the original page for a URL source, the
      // full-size image for an image source (previewUrl doubles as this —
      // it's already a public embed-side link, just wasn't clickable
      // before), or nothing for kinds with no public serving endpoint.
      const linkUrl = s.url || (s.kind === 'image' ? s.previewUrl : null);
      const card = document.createElement(linkUrl ? 'a' : 'div');
      card.className = 'source-card';
      if (linkUrl) {
        card.href = linkUrl;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
      }
      if (s.previewUrl) {
        const img = document.createElement('img');
        img.className = 'src-thumb'; img.src = s.previewUrl; img.alt = s.fileName || '';
        card.appendChild(img);
      } else {
        const ic = document.createElement('div');
        ic.className = 'src-icon';
        ic.textContent = ({ pdf:'📄', docx:'📝', text:'📃', audio:'🔊', video:'🎬', image:'🖼️', url:'🔗' })[s.kind] || '📎';
        card.appendChild(ic);
      }
      const lbl = document.createElement('div');
      lbl.className = 'src-label';
      lbl.textContent = s.fileName || '';
      card.appendChild(lbl);
      wrap.appendChild(card);
    }
    afterEl.parentNode.insertBefore(wrap, afterEl.nextSibling);
  }

  function attachOptionButtons(afterEl, options) {
    if (!options || options.length < 2) return;
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    for (const opt of options) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quick-reply';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        for (const b of wrap.querySelectorAll('.quick-reply')) b.disabled = true;
        btn.classList.add('selected');
        sendMessage(opt);
      });
      wrap.appendChild(btn);
    }
    afterEl.parentNode.insertBefore(wrap, afterEl.nextSibling);
  }

  /**
   * Inline auto-embedded figure — a rendered PDF page Gemini vision
   * classified as containing a diagram/chart, shown directly in the
   * message flow whenever a retrieved chunk has one (no click needed to
   * reveal it — that was the chosen design over a click-to-expand chip).
   */
  function renderFigureCard(fig) {
    const card = document.createElement('div');
    card.className = 'figure-card';

    const img = document.createElement('img');
    img.src = fig.pageImageUrl;
    img.alt = fig.caption || fig.fileName || 'Figure';
    card.appendChild(img);

    if (fig.caption || fig.fileName) {
      const cap = document.createElement('div');
      cap.className = 'figure-caption';
      cap.textContent = [fig.caption, fig.fileName && fig.pdfPage ? `${fig.fileName}, p.${fig.pdfPage}` : fig.fileName]
        .filter(Boolean).join(' — ');
      card.appendChild(cap);
    }

    if (fig.pdfUrl) {
      const link = document.createElement('a');
      link.className = 'figure-pdf-link';
      link.href = `${fig.pdfUrl}#page=${fig.pdfPage || 1}`;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = `↗ Open PDF at page ${fig.pdfPage || 1}`;
      card.appendChild(link);
    }

    messagesEl.appendChild(card);
    requestAnimationFrame(() => card.classList.add('visible'));
    scrollToBottom();
  }

  // ── Study mode: quiz me ──────────────────────────────────────
  quizBtn.addEventListener('click', () => {
    const topic = textInput.value.trim();
    textInput.value = '';
    textInput.style.height = 'auto';
    sendStudyMessage(topic ? `Quiz me on: ${topic}` : 'Quiz me on a topic from what you know, your choice.');
  });

  async function sendStudyMessage(message) {
    addMessage('user', message);
    quizBtn.disabled = true;
    sendBtn.disabled = true;
    statusText.textContent = 'Thinking…';
    try {
      const res = await fetch(`/embed/${publicId}/study`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sessionId }),
      });
      const data = await res.json();
      if (!res.ok) {
        addMessage('bot', data.limitMessage || data.error || 'Study tools are unavailable right now.');
        return;
      }
      if (data.sessionId) sessionId = data.sessionId;

      const answerEl = addMessage('bot', data.answer);
      if (config.project.showSourceCards !== false && data.sources && data.sources.length) {
        attachSources(answerEl, data.sources);
      }

      for (const fig of data.figures || []) renderFigureCard(fig);

      for (const call of data.toolCalls || []) {
        const topic = call.args && call.args.topic;
        if (call.name === 'generate_quiz' && call.result && call.result.questions) {
          for (const q of call.result.questions) renderQuizCard(q, topic, data.sources || []);
        }
        if (call.name === 'generate_flashcards' && call.result && call.result.cards) {
          for (const c of call.result.cards) renderFlashcard(c, topic, data.sources || []);
        }
      }
    } catch (e) {
      addMessage('bot', 'Something went wrong loading your study material.');
    } finally {
      quizBtn.disabled = false;
      sendBtn.disabled = false;
      statusText.textContent = statusDot.classList.contains('connected') ? 'Connected' : 'Disconnected';
    }
  }

  function renderQuizCard(q, topic, turnSources) {
    const card = document.createElement('div');
    card.className = 'quiz-card';

    if (q.origin === 'owner') {
      const tag = document.createElement('div');
      tag.className = 'quiz-origin';
      tag.textContent = 'From your instructor';
      card.appendChild(tag);
    }

    const questionEl = document.createElement('div');
    questionEl.className = 'quiz-question';
    questionEl.textContent = q.question;
    card.appendChild(questionEl);

    const optionsEl = document.createElement('div');
    optionsEl.className = 'quiz-options';
    const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = `${letters[idx] || idx + 1}. ${opt}`;
      btn.addEventListener('click', () => gradeQuiz(card, q, topic, idx));
      optionsEl.appendChild(btn);
    });
    card.appendChild(optionsEl);

    const feedback = document.createElement('div');
    feedback.className = 'quiz-feedback';
    feedback.style.display = 'none';
    card.appendChild(feedback);

    messagesEl.appendChild(card);
    requestAnimationFrame(() => card.classList.add('visible'));
    scrollToBottom();

    if (q.sourceChunkIds && q.sourceChunkIds.length && turnSources.length) {
      attachSources(card, turnSources);
    }
  }

  function gradeQuiz(card, q, topic, selectedIdx) {
    const buttons = [...card.querySelectorAll('.quiz-option')];
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correctIndex) btn.classList.add('correct');
      else if (idx === selectedIdx) btn.classList.add('incorrect');
    });

    const feedback = card.querySelector('.quiz-feedback');
    feedback.style.display = '';
    feedback.textContent = selectedIdx === q.correctIndex
      ? 'Correct!'
      : 'Not quite — the correct answer is highlighted above.';

    fetch(`/embed/${publicId}/quiz-attempt`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        question: q.question,
        topic,
        selectedIndex: selectedIdx,
        correctIndex: q.correctIndex,
        sourceChunkIds: q.sourceChunkIds || [],
      }),
    }).catch(() => {});
  }

  function renderFlashcard(c, topic, turnSources) {
    const card = document.createElement('div');
    card.className = 'quiz-card flash-card';

    if (c.origin === 'owner') {
      const tag = document.createElement('div');
      tag.className = 'quiz-origin';
      tag.textContent = 'From your instructor';
      card.appendChild(tag);
    }

    const face = document.createElement('div');
    face.className = 'flash-face';
    face.textContent = c.front;
    card.appendChild(face);

    const flipBtn = document.createElement('button');
    flipBtn.className = 'quiz-option';
    flipBtn.textContent = 'Show answer';
    flipBtn.addEventListener('click', () => {
      face.textContent = c.back;
      face.classList.add('flash-face-back');
      flipBtn.remove();
      ratingEl.style.display = 'flex';
    }, { once: true });
    card.appendChild(flipBtn);

    const ratingEl = document.createElement('div');
    ratingEl.className = 'quiz-options';
    ratingEl.style.display = 'none';
    ratingEl.style.flexDirection = 'row';
    ['still_learning', 'got_it'].forEach(rating => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.style.flex = '1';
      btn.textContent = rating === 'got_it' ? '✓ Got it' : '↻ Still learning';
      btn.addEventListener('click', () => reviewFlashcard(card, ratingEl, c, topic, rating));
      ratingEl.appendChild(btn);
    });
    card.appendChild(ratingEl);

    messagesEl.appendChild(card);
    requestAnimationFrame(() => card.classList.add('visible'));
    scrollToBottom();

    if (c.sourceChunkId && turnSources.length) attachSources(card, turnSources);
  }

  function reviewFlashcard(card, ratingEl, c, topic, rating) {
    [...ratingEl.querySelectorAll('.quiz-option')].forEach(btn => {
      btn.disabled = true;
      if (btn.textContent.includes(rating === 'got_it' ? 'Got it' : 'Still learning')) {
        btn.classList.add(rating === 'got_it' ? 'correct' : 'incorrect');
      }
    });

    fetch(`/embed/${publicId}/flashcard-review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        front: c.front,
        back: c.back,
        topic,
        sourceChunkId: c.sourceChunkId || null,
        selfRating: rating,
      }),
    }).catch(() => {});
  }

  // ── Progress panel ────────────────────────────────────────────
  progressBtn.addEventListener('click', async () => {
    if (!sessionId) {
      addMessage('bot', 'Chat a bit first, then check back here for your progress!');
      return;
    }
    progressBtn.disabled = true;
    try {
      const res = await fetch(`/embed/${publicId}/progress?sessionId=${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      if (!res.ok) { addMessage('bot', data.error || 'Could not load your progress.'); return; }
      renderProgressCard(data);
    } catch (e) {
      addMessage('bot', 'Could not load your progress.');
    }
    progressBtn.disabled = false;
  });

  function renderProgressCard(p) {
    const card = document.createElement('div');
    card.className = 'quiz-card';

    const title = document.createElement('div');
    title.className = 'quiz-question';
    title.textContent = '📊 Your progress';
    card.appendChild(title);

    if (p.scope === 'session') {
      const note = document.createElement('div');
      note.className = 'quiz-origin';
      note.style.marginBottom = '8px';
      note.textContent = "This visit only — share your email to track progress across visits";
      card.appendChild(note);
    }

    const stats = document.createElement('div');
    stats.className = 'quiz-feedback';
    stats.style.display = '';
    stats.style.marginTop = '0';
    const accuracyText = p.quizAccuracy === null ? 'no quizzes yet' : `${p.quizAccuracy}% correct (${p.totalQuizAttempts} question${p.totalQuizAttempts === 1 ? '' : 's'})`;
    stats.innerHTML = `Quiz accuracy: ${accuracyText}<br>Flashcards reviewed: ${p.cardsReviewed}<br>Study streak: ${p.streak} day${p.streak === 1 ? '' : 's'}`;
    card.appendChild(stats);

    if (p.byTopic && p.byTopic.length) {
      const topicsEl = document.createElement('div');
      topicsEl.className = 'quiz-options';
      topicsEl.style.marginTop = '10px';
      p.byTopic.forEach(t => {
        const row = document.createElement('div');
        row.className = 'quiz-option';
        row.style.cursor = 'default';
        const parts = [];
        if (t.quizAccuracy !== null) parts.push(`${t.quizAccuracy}% quiz accuracy`);
        if (t.cardsReviewed) parts.push(`${t.cardsReviewed} card${t.cardsReviewed === 1 ? '' : 's'} reviewed`);
        row.textContent = `${t.topic}: ${parts.join(', ')}`;
        topicsEl.appendChild(row);
      });
      card.appendChild(topicsEl);
    }

    messagesEl.appendChild(card);
    requestAnimationFrame(() => card.classList.add('visible'));
    scrollToBottom();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    });
  }

  // Only body content is replaced — the <head>'s embed.css stays loaded,
  // so --accent/--bg/etc. (including the project's themeColor, applied to
  // --accent earlier in boot when config loaded successfully) still style
  // this the same as the rest of the widget instead of a bare unstyled div.
  function showFatal(msg) {
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif">
        <div role="alert" style="max-width:320px;text-align:center;background:var(--bg-2);border:1px solid var(--border);border-radius:16px;padding:28px 24px">
          <div style="font-size:32px;margin-bottom:12px" aria-hidden="true">⚠️</div>
          <p style="color:var(--text);font-size:14px;line-height:1.5;margin:0 0 20px">${msg}</p>
          <button type="button" onclick="location.reload()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font:inherit;font-weight:600;font-size:13px;cursor:pointer">Try again</button>
        </div>
      </div>`;
  }

  // ── 6. Open/close + avatar canvas shuttling ──────────────────
  function openPanel() {
    panelOpen = true;
    root.dataset.state = 'open';
    unreadCount = 0;
    launcherBadge.hidden = true;
    launcher.setAttribute('aria-expanded', 'true');

    // Move canvas from launcher to avatar stage
    if (avatarCanvas && !avatarCanvasSlot.contains(avatarCanvas)) {
      avatarCanvasSlot.appendChild(avatarCanvas);
      Object.assign(avatarCanvas.style, {
        width: '100%', height: '100%',
        borderRadius: '12px',
      });
    }

    // Move focus into the panel — textInput is present in every mode
    // (voice and text-only both render the composer).
    textInput.focus();

    notifyParent({ type: 'open', fullscreen: fullscreenActive });
  }

  function closePanel(skipAnim) {
    panelOpen = false;
    root.dataset.state = skipAnim ? 'closed-instant' : 'closed';
    launcher.setAttribute('aria-expanded', 'false');

    // Move canvas to launcher slot so it keeps animating there
    if (avatarCanvas && config && config.project.showAvatarInLauncher !== false) {
      if (!launcherAvatarSlot.contains(avatarCanvas)) {
        launcherAvatarSlot.appendChild(avatarCanvas);
        Object.assign(avatarCanvas.style, {
          width: '100%', height: '100%',
          borderRadius: '50%',
        });
      }
      launcherFallback.style.display = 'none';
    }

    // Restore focus to the control that opened the panel, so keyboard
    // users aren't dropped back at the top of the host page.
    launcher.focus();

    notifyParent({ type: 'close' });
  }

  function bumpUnread() {
    unreadCount += 1;
    launcherBadge.textContent = String(Math.min(unreadCount, 99));
    launcherBadge.hidden = false;
  }

  launcher.addEventListener('click', openPanel);
  minimizeBtn.addEventListener('click', () => closePanel());
  handoffBtn.addEventListener('click', () => requestHandoff());
  fullscreenBtn.addEventListener('click', () => {
    fullscreenActive = !fullscreenActive;
    root.dataset.fullscreen = fullscreenActive ? '1' : '0';
    updateFullscreenIcon();
    notifyParent({ type: 'fullscreen', enabled: fullscreenActive });
  });

  function notifyParent(payload) {
    try { parent.postMessage({ source: 'avatar-platform', publicId, ...payload }, '*'); } catch (_) {}
  }

  // ── 7. Composer + input handling ─────────────────────────────
  textInput.addEventListener('input', () => {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
    if ((config?.project?.textDirection || 'auto') === 'auto') {
      const dir = detectDirection(textInput.value) || 'ltr';
      textInput.style.direction = dir;
      textInput.style.textAlign = dir === 'rtl' ? 'right' : 'left';
    }
  });
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(textInput.value);
    }
  });
  sendBtn.addEventListener('click', () => sendMessage(textInput.value));

  imageBtn.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    imageInput.value = '';
    if (file) handleImageFile(file);
  });

  let micOn = false;
  micBtn.addEventListener('click', async () => {
    if (!avatar) return;
    if (!statusDot.classList.contains('connected')) {
      avatar.connect();
      waitForConnected(() => micBtn.click(), 50);
      return;
    }
    if (micOn) { avatar.stopMic(); micBtn.classList.remove('active'); micOn = false; }
    else       { await avatar.startMic(); micBtn.classList.add('active'); micOn = true; }
  });

  // ── 8. Logging ──────────────────────────────────────────────
  async function logTurn(role, text) {
    try {
      const res = await fetch(`/embed/${publicId}/log`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, role, text }),
      });
      if (res.ok) { const j = await res.json(); if (j.sessionId) sessionId = j.sessionId; }
    } catch (_) {}
    // Relay to the host page's ap:message/ap:response listeners (see
    // embed-loader.js's postMessage handler and public/docs/prefetching.html)
    // — additive to the /log call above, not a replacement for it.
    if (role === 'user') {
      notifyParent({ type: 'message', sessionId, role, text });
    } else {
      notifyParent({ type: 'response', sessionId, answer: text });
    }
  }

  // ── Commands from embed-loader.js ──────────────────────────────
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.source !== 'avatar-platform-host') return;
    if (e.data.type === 'open' && !panelOpen) openPanel();
    if (e.data.type === 'close' && panelOpen) closePanel();
    if (e.data.type === 'drag-end') {
      const headerEl = document.getElementById('header');
      if (headerEl) headerEl.style.cursor = '';
    }
  });

  // ── Capture helpers ─────────────────────────────────────────
  function buildKnowledgeBaseToolInstructions() {
    return `

You have a search_knowledge_base tool connected to this website's uploaded documents and indexed pages. Call it whenever the user asks something that might be covered there — don't guess or rely on general knowledge for anything specific to this business/product/topic. It's fine to call it more than once per turn if the first search doesn't return what you need. If it returns nothing relevant, say so honestly rather than making something up.`;
  }

  // The one retrieval mechanism for the whole avatar widget — voice and
  // typed messages alike. Gemini Live calls this mid-session whenever the
  // model decides it needs knowledge-base content (see lipsync-sdk.js's
  // opts.tools), instead of the old approach of always re-fetching and
  // reconnecting the whole session on every typed message (which also
  // silently dropped the AI's memory of the conversation so far — a fresh
  // Live session has no history from the one it replaced). Backs onto the
  // same /retrieve endpoint the text-only /ask fallback already used.
  function searchKnowledgeBaseTool() {
    return {
      name: 'search_knowledge_base',
      description:
        "Search this chatbot's knowledge base (uploaded documents and indexed web pages) for information " +
        "relevant to the user's question. Call this whenever you need specific facts, details, or content " +
        "from the owner's material.",
      parameters: {
        type: 'object',
        properties: {
          query: {
            type: 'string',
            description: "A focused search query — the specific question or topic to look up, not necessarily the user's exact wording.",
          },
        },
        required: ['query'],
      },
      handler: async ({ query }) => {
        try {
          const res = await fetch(`/embed/${publicId}/retrieve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: String(query || '').slice(0, 500), k: 5 }),
          });
          if (!res.ok) return { error: `Search failed (HTTP ${res.status})` };
          const data = await res.json();
          pendingSources = (config.project.showSourceCards !== false) ? (data.sources || []) : null;
          pendingFigures = data.figures || [];
          if (!data.chunks || !data.chunks.length) {
            return { results: [], note: 'No relevant content found in the knowledge base for this query.' };
          }
          return { results: data.chunks.map(c => ({ source: c.fileName || 'unnamed', text: c.text })) };
        } catch (e) {
          return { error: e.message || 'Search failed' };
        }
      },
    };
  }

  function buildCaptureInstructions(fields) {
    if (!fields || fields.length === 0) return '';
    const fieldLines = fields.map(f =>
      `  - ${f.label} (key: ${f.key}, type: ${f.type}${f.required ? ', required' : ', optional'}${f.options ? ', options: ' + f.options.join('/') : ''})`
    ).join('\n');
    return `

LEAD CAPTURE INSTRUCTIONS: During this conversation, naturally collect the following details from the visitor. Weave the questions into the conversation — don't ask all at once. When you receive a value, output a tag on a new line in this exact format: [[CAPTURE:key=value]]
Do not mention the tag to the user — it will be stripped before display.

Fields to collect:
${fieldLines}

Always tag a value as soon as you receive it. If the visitor provides multiple values at once, emit one tag per line.`;
  }

  const CAPTURE_TAG_RE = /\[\[CAPTURE:([a-z][a-z0-9_]*)=([^\]]*)\]\]/g;

  function extractCaptureTags(text) {
    const tags = [];
    let clean = text.replace(CAPTURE_TAG_RE, (_, key, value) => {
      tags.push({ key, value: value.trim() });
      return '';
    });
    clean = clean.replace(/\n{3,}/g, '\n\n').trim();
    return { clean, tags };
  }

  // ── Quick-reply helpers ──────────────────────────────────────
  function buildQuickReplyInstructions(enabled) {
    if (!enabled) return '';
    return `

QUICK REPLY INSTRUCTIONS: When you offer the user a small, closed set of choices to pick from (a menu of next steps, an either/or decision, a short list of topics) — and only then — append a line in this exact format after your response: [[OPTIONS:Choice one|Choice two|Choice three]]
Use 2 to 5 short options. Do not mention the tag to the user — it will be stripped before display and shown as tappable buttons. Do not use this for open-ended questions or when collecting free-text information.`;
  }

  function buildHandoffInstructions(enabled) {
    if (!enabled) return '';
    return `

HUMAN HANDOFF: If you cannot help the visitor after a genuine effort, or they explicitly ask for a person/human/representative, say so naturally and append the exact tag [[REQUEST_HUMAN]] on its own line. Do not mention the tag to the user — it will be stripped before display.`;
  }

  const OPTIONS_TAG_RE = /\[\[OPTIONS:([^\]]+)\]\]/g;

  function extractOptionsTag(text) {
    let options = null;
    let clean = text.replace(OPTIONS_TAG_RE, (_, list) => {
      options = list.split('|').map(s => s.trim()).filter(Boolean).slice(0, 5);
      return '';
    });
    clean = clean.replace(/\n{3,}/g, '\n\n').trim();
    return { clean, options };
  }

  function updateCapturePanel() {
    const keys = Object.keys(sessionCapture);
    if (keys.length === 0) return;

    const detailsPanel = document.getElementById('details-panel');
    const body  = document.getElementById('details-body');
    const pill  = document.getElementById('capture-pill');

    detailsPanel.style.display = 'block';

    const total    = captureFields.length;
    pill.style.display = 'inline';
    pill.textContent = total > 0 ? `${keys.length}/${total} captured` : `${keys.length} captured`;

    const fieldMap = Object.fromEntries(captureFields.map(f => [f.key, f.label]));
    body.innerHTML = keys.map(k => `
      <div style="display:flex;gap:8px;align-items:baseline">
        <span style="font-size:10px;opacity:.6;flex:0 0 90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(fieldMap[k] || k)}</span>
        <span style="font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(sessionCapture[k])}</span>
      </div>`).join('');
  }

  let detailsOpen = true;
  function toggleDetailsPanel() {
    detailsOpen = !detailsOpen;
    document.getElementById('details-body').style.display = detailsOpen ? 'flex' : 'none';
    document.getElementById('details-chevron').textContent = detailsOpen ? '▲' : '▼';
  }

  function scheduleSaveLead() {
    if (captureFields.length === 0) return;
    clearTimeout(saveLeadTimer);
    saveLeadTimer = setTimeout(async () => {
      if (!sessionId || Object.keys(sessionCapture).length === 0) return;
      try {
        await fetch(`/embed/${publicId}/lead`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, data: sessionCapture }),
        });
      } catch (_) {}
    }, 2000);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  boot();
  </script>
</body>
</html>
