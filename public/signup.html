<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="signup.pageTitle">Sign up — AvatarPlatform</title>
  <meta name="description" content="Create your free AvatarPlatform account and build your first AI talking-agent chatbot in minutes." />
  <link rel="canonical" href="https://avatarplatform.ai/signup" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AvatarPlatform" />
  <meta property="og:title" content="Sign up — AvatarPlatform" />
  <meta property="og:description" content="Create your free AvatarPlatform account and build your first AI talking-agent chatbot in minutes." />
  <meta property="og:url" content="https://avatarplatform.ai/signup" />
  <meta property="og:image" content="https://avatarplatform.ai/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sign up — AvatarPlatform" />
  <meta name="twitter:description" content="Create your free AvatarPlatform account and build your first AI talking-agent chatbot in minutes." />
  <meta name="twitter:image" content="https://avatarplatform.ai/og-image.png" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('apTheme') === 'dark' ? 'dark' : 'light';
    (function () {
      var RTL_LANGS = { ar: 1 };
      var KNOWN = ['en', 'es', 'fr', 'ar', 'hi'];
      var saved = localStorage.getItem('apLang');
      var lang = KNOWN.indexOf(saved) !== -1 ? saved : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = RTL_LANGS[lang] ? 'rtl' : 'ltr';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="lang-switch-slot" style="position:fixed;top:16px;inset-inline-end:16px;z-index:20"></div>
  <div id="theme-toggle-slot" style="position:fixed;top:16px;inset-inline-start:16px;z-index:20"></div>
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="width:100%;max-width:400px">
      <a class="brand" href="/" style="margin-bottom:24px;justify-content:center">
        <span class="brand-mark">AP</span>
        <span>AvatarPlatform</span>
      </a>
      <h1 style="font-size:22px;margin:0 0 4px;text-align:center" data-i18n="signup.title">Create your account</h1>
      <p class="muted text-sm text-center" style="margin:0 0 24px" data-i18n="signup.subtitle">Start with the free plan — no card required</p>

      <form id="signup-form" class="col gap-md">
        <div class="field">
          <label data-i18n="signup.nameLabel">Name</label>
          <input class="input" type="text" id="name" required autofocus autocomplete="name" />
        </div>
        <div class="field">
          <label data-i18n="common.form.emailLabel">Email</label>
          <input class="input" type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label data-i18n="common.form.passwordLabel">Password</label>
          <input class="input" type="password" id="password" required minlength="8" autocomplete="new-password" />
          <span class="help" data-i18n="signup.passwordHelp">At least 8 characters</span>
        </div>
        <div id="error" class="text-sm" style="color:var(--danger);display:none"></div>
        <button class="btn btn-primary btn-lg" type="submit" id="submit" data-i18n="signup.submit">Create account</button>
      </form>

      <p class="muted text-sm text-center" style="margin-top:20px">
        <span data-i18n="signup.haveAccount">Already have an account?</span> <a href="/login" data-i18n="common.nav.login">Log in</a>
      </p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/es.js"></script>
  <script src="/js/i18n/fr.js"></script>
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n/hi.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
  mountThemeToggle(document.getElementById('theme-toggle-slot'));
  I18N.init(document.getElementById('lang-switch-slot'));

  if (Auth.loggedIn()) location.href = '/dashboard';

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit');
    const err = document.getElementById('error');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = I18N.t('signup.submitting', 'Creating…');
    try {
      const res = await API.signup(
        document.getElementById('name').value.trim(),
        document.getElementById('email').value.trim(),
        document.getElementById('password').value,
      );
      Auth.token = res.token;
      Auth.user = res.user;
      const plan = new URLSearchParams(location.search).get('plan');
      location.href = (plan && plan !== 'free') ? `/billing?plan=${encodeURIComponent(plan)}` : '/dashboard';
    } catch (e2) {
      err.textContent = e2.message;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = I18N.t('signup.submit', 'Create account');
    }
  });
  </script>
</body>
</html>
