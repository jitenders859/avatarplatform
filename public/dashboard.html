<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — AvatarPlatform</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="robots" content="noindex" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('apTheme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .project-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
      position: relative;
      overflow: hidden;
    }
    .project-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--project-accent);
      opacity: .85;
    }
    .project-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .project-card-link { text-decoration: none; color: inherit; display: flex; gap: 12px; align-items: flex-start; }
    .project-card-avatar {
      flex: none; width: 38px; height: 38px; border-radius: 10px;
      background: color-mix(in srgb, var(--project-accent) 16%, var(--bg-3));
      color: var(--project-accent);
      display: grid; place-items: center;
      font-weight: 700; font-size: 15px;
    }
    .project-card-footer {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container mt-md">
    <div id="verify-banner" class="card mb-md" hidden style="display:flex;align-items:center;gap:12px;background:var(--warn-bg);border-color:var(--warn-border)">
      <span style="font-size:20px">✉️</span>
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">Verify your email</div>
        <div class="muted text-sm">Check your inbox for a verification link.</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="resend-verify-btn">Resend email</button>
    </div>

    <div class="page-header">
      <div>
        <h1 class="page-title">Your chatbots</h1>
        <p class="page-sub" id="plan-line">Loading plan…</p>
      </div>
      <button class="btn btn-primary" id="create-btn">+ New chatbot</button>
    </div>

    <div id="grid" class="grid grid-3"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🤖</div>
      <div class="empty-title">No chatbots yet</div>
      <p class="muted text-sm">Create your first chatbot to get started.</p>
      <button class="btn btn-primary mt-md" id="empty-create">Create chatbot</button>
    </div>
  </div>

  <!-- Create modal -->
  <div class="modal-backdrop" id="create-modal" hidden>
    <div class="modal">
      <h2 style="font-size:18px;margin:0 0 4px">Create a chatbot</h2>
      <p class="muted text-sm" style="margin:0 0 20px">You can change everything later.</p>
      <form id="create-form" class="col gap-md">
        <div class="field">
          <label>Name</label>
          <input class="input" id="new-name" required maxlength="60" placeholder="Support bot" autofocus />
        </div>
        <div class="field">
          <label>Character</label>
          <select class="select" id="new-character"></select>
        </div>
        <div id="create-error" class="text-sm" style="color:var(--danger);display:none"></div>
        <div class="row" style="justify-content:flex-end;margin-top:8px">
          <button type="button" class="btn btn-ghost" id="create-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="create-submit">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
  Auth.requireLogin();
  renderTopNav('dashboard');

  const grid = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  const planLine = document.getElementById('plan-line');

  let characters = [];

  async function load() {
    try {
      const [{ projects }, { characters: chars }, sub, meResult] = await Promise.all([
        API.listProjects(), API.characters(), API.subscription().catch(() => null), API.me().catch(() => null),
      ]);
      document.getElementById('verify-banner').hidden = !meResult || !!meResult.user.emailVerifiedAt;
      characters = chars;
      const select = document.getElementById('new-character');
      select.innerHTML = chars.map(c =>
        `<option value="${c.id}">${c.name} — ${c.description}</option>`
      ).join('');

      if (sub) {
        const plan = sub.plan;
        // plan.name can now be admin-defined free text (custom plan tiers),
        // not just one of the 4 hardcoded plan strings — build the pill via
        // textContent instead of interpolating into innerHTML to avoid a
        // stored-XSS path, matching billing.html's handling of plan.name.
        planLine.textContent = 'Plan: ';
        const pill = document.createElement('span');
        pill.className = 'pill pill-info';
        pill.textContent = plan.name;
        planLine.appendChild(pill);
        planLine.appendChild(document.createTextNode(' · '));
        const link = document.createElement('a');
        link.href = '/billing';
        link.textContent = 'Manage billing';
        planLine.appendChild(link);
      }

      if (projects.length === 0) { emptyEl.hidden = false; grid.hidden = true; return; }

      grid.innerHTML = projects.map((p) => `
        <div class="project-card" style="--project-accent:${p.themeColor || 'var(--accent)'}">
          <a href="/project?id=${p.id}" class="project-card-link">
            <div class="project-card-avatar">${escape((p.name || '?').trim().charAt(0).toUpperCase())}</div>
            <div style="min-width:0;flex:1">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                <div style="font-weight:600;font-size:14.5px;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escape(p.name)}</div>
                <span class="pill" style="flex:none">${p.widgetPosition || 'bottom-right'}</span>
              </div>
              <div class="muted text-sm mt-sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${charName(p.characterId)} · /e/${p.publicId}</div>
            </div>
          </a>
          <div class="project-card-footer">
            ${p.leadCount > 0 ? `<a href="/project?id=${p.id}#leads" class="pill pill-success" style="text-decoration:none;font-size:11px">📋 ${p.leadCount} lead${p.leadCount === 1 ? '' : 's'}</a>` : '<span></span>'}
            <button class="btn btn-sm btn-ghost" onclick="duplicate('${p.id}', event)">⎘ Duplicate</button>
          </div>
        </div>
      `).join('');
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function charName(id) {
    const c = characters.find(c => c.id === id);
    return c ? c.name : id;
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  window.duplicate = async (id, e) => {
    e.preventDefault();
    e.stopPropagation();
    try {
      await API.duplicateProject(id);
      toast('Chatbot duplicated', 'success');
      load();
    } catch (err) { toast(err.message, 'error'); }
  };

  // Create modal
  const modal = document.getElementById('create-modal');
  let modalOpenerEl = null;
  function openModal(e) {
    modalOpenerEl = e ? e.currentTarget : null;
    modal.hidden = false;
    document.getElementById('new-name').focus();
  }
  function closeModal() {
    modal.hidden = true;
    document.getElementById('create-form').reset();
    document.getElementById('create-error').style.display='none';
    document.getElementById('create-submit').disabled = false;
    if (modalOpenerEl) modalOpenerEl.focus();
    modalOpenerEl = null;
  }
  document.getElementById('create-btn').addEventListener('click', openModal);
  document.getElementById('empty-create').addEventListener('click', openModal);
  document.getElementById('create-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

  document.getElementById('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('create-submit');
    const err = document.getElementById('create-error');
    err.style.display = 'none';
    btn.disabled = true;
    try {
      const { project } = await API.createProject({
        name: document.getElementById('new-name').value.trim(),
        characterId: document.getElementById('new-character').value,
      });
      location.href = `/project?id=${project.id}`;
    } catch (e2) {
      err.textContent = e2.message;
      err.style.display = 'block';
      btn.disabled = false;
      if (/limit/i.test(e2.message)) {
        err.innerHTML += ' <a href="/billing">Upgrade</a>';
      } else if (e2.code === 'EMAIL_NOT_VERIFIED') {
        document.getElementById('verify-banner').hidden = false;
        document.getElementById('verify-banner').scrollIntoView({ behavior: 'smooth' });
      }
    }
  });

  document.getElementById('resend-verify-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      await API.resendVerification();
      toast('Verification email sent — check your inbox.', 'success');
    } catch (err) {
      toast(err.message, 'error');
    }
    btn.disabled = false;
  });

  load();
  </script>
</body>
</html>
