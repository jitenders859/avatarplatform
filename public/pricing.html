<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="pricing.pageTitle">Pricing — AvatarPlatform</title>
  <meta name="description" content="Simple, transparent pricing for AI talking-agent chatbots — from a free tier to custom enterprise plans." />
  <link rel="canonical" href="https://avatarplatform.ai/pricing" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AvatarPlatform" />
  <meta property="og:title" content="Pricing — AvatarPlatform" />
  <meta property="og:description" content="Simple, transparent pricing for AI talking-agent chatbots — from a free tier to custom enterprise plans." />
  <meta property="og:url" content="https://avatarplatform.ai/pricing" />
  <meta property="og:image" content="https://avatarplatform.ai/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pricing — AvatarPlatform" />
  <meta name="twitter:description" content="Simple, transparent pricing for AI talking-agent chatbots — from a free tier to custom enterprise plans." />
  <meta name="twitter:image" content="https://avatarplatform.ai/og-image.png" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('apTheme') === 'dark' ? 'dark' : 'light';
    (function () {
      var RTL_LANGS = { ar: 1 };
      var KNOWN = ['en', 'es', 'fr', 'ar', 'hi'];
      var saved = localStorage.getItem('apLang');
      var lang = KNOWN.indexOf(saved) !== -1 ? saved : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = RTL_LANGS[lang] ? 'rtl' : 'ltr';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .pricing-hero { padding: 56px 24px 8px; text-align: center; }
    .pricing-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px; font-weight: 600;
      color: var(--accent-strong);
      margin-bottom: 18px;
    }
    .pricing-title { font-size: clamp(30px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 10px; }
    .pricing-sub { font-size: 16px; color: var(--text-2); }
    .plan-card {
      position: relative;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .plan-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .plan-card.popular { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-lg); }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "AvatarPlatform",
    "description": "AI talking-agent chatbot platform — animated Rive characters, Gemini Live voice, and a RAG knowledge base, embeddable on any website.",
    "url": "https://avatarplatform.ai/pricing",
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "url": "https://avatarplatform.ai/pricing" },
      { "@type": "Offer", "name": "Starter", "price": "19", "priceCurrency": "USD", "url": "https://avatarplatform.ai/pricing" },
      { "@type": "Offer", "name": "Pro", "price": "59", "priceCurrency": "USD", "url": "https://avatarplatform.ai/pricing" },
      { "@type": "Offer", "name": "Business", "price": "199", "priceCurrency": "USD", "url": "https://avatarplatform.ai/pricing" }
    ]
  }
  </script>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="/"><span class="brand-mark">AP</span><span>AvatarPlatform</span></a>
      <div class="spacer"></div>
      <div class="nav-links">
        <a class="nav-link" href="/docs" data-i18n="common.nav.docs">Docs</a>
        <a class="nav-link active" href="/pricing" data-i18n="common.nav.pricing">Pricing</a>
        <a class="nav-link" href="/characters" data-i18n="common.nav.characters">Characters</a>
        <a class="nav-link" href="/login" data-i18n="common.nav.login">Log in</a>
      </div>
      <div id="lang-switch-slot"></div>
      <div id="theme-toggle-slot"></div>
      <a class="btn btn-primary btn-sm" href="/signup" data-i18n="common.nav.getStartedShort">Get started</a>
    </div>
  </nav>

  <div class="pricing-hero">
    <span class="pricing-eyebrow" data-i18n="pricing.eyebrow">Pricing</span>
    <h1 class="pricing-title" data-i18n="pricing.title">Pricing</h1>
    <p class="pricing-sub" data-i18n="pricing.subtitle">Start free. No card required. Upgrade when you outgrow it.</p>
  </div>

  <div class="container mt-lg">
    <div class="row gap-sm mb-md" id="coupon-row" style="align-items:center;justify-content:center;display:none">
      <input type="text" id="coupon-input" class="input" data-i18n-attr="placeholder:pricing.couponPlaceholder" placeholder="Have a coupon code?" style="max-width:220px;text-transform:uppercase" />
      <span class="text-sm muted" data-i18n="pricing.couponHint">Applied when you upgrade below</span>
    </div>
    <div class="grid grid-4" id="plans-grid"></div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/es.js"></script>
  <script src="/js/i18n/fr.js"></script>
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n/hi.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
  mountThemeToggle(document.getElementById('theme-toggle-slot'));
  I18N.init(document.getElementById('lang-switch-slot'));

  // Plan name/description/features come from the server (backend/plans.js)
  // in English only — translating those would mean threading a language
  // param through the billing API. Instead, translate client-side by plan
  // id for the four built-in plans (stable ids: free/starter/pro/business);
  // an admin-created custom tier has no id we know ahead of time, so it
  // falls back to the API's own (English) text rather than showing blank.
  function localizePlan(p) {
    const key = `pricing.plans.${p.id}`;
    return {
      name: I18N.t(`${key}.name`, p.name),
      description: I18N.t(`${key}.description`, p.description),
      features: p.features.map((f, i) => I18N.t(`${key}.features.${i}`, f)),
    };
  }

  async function load() {
    try {
      const loggedIn = Auth.loggedIn();
      const [{ plans, stripeEnabled }, sub] = await Promise.all([
        API.plans(),
        loggedIn ? API.subscription().catch(() => null) : Promise.resolve(null),
      ]);
      const currentPlanId = sub ? sub.plan.id : null;
      // Only logged-in visitors ever click straight into checkout here —
      // anonymous CTAs go to /signup instead, so a coupon input is
      // meaningless (and confusing) for them.
      if (loggedIn) document.getElementById('coupon-row').style.display = 'flex';

      document.getElementById('plans-grid').innerHTML = plans.map(p => {
        const l = localizePlan(p);
        return `
        <div class="card plan-card${p.popular ? ' popular' : ''}">
          ${p.popular ? `<span class="pill pill-info" style="position:absolute;top:-10px;left:20px">${I18N.t('pricing.mostPopular', 'Most popular')}</span>` : ''}
          <h3 style="margin:0 0 4px;font-size:18px">${l.name}</h3>
          <div style="font-size:32px;font-weight:700;letter-spacing:-0.02em">$${p.priceMonthly}<span class="muted text-sm" style="font-weight:400">${I18N.t('pricing.perMonth', '/mo')}</span></div>
          <p class="muted text-sm" style="margin:6px 0 16px">${l.description}</p>
          <ul style="list-style:none;padding:0;margin:0 0 20px;font-size:13px">
            ${l.features.map(f => `<li style="padding:4px 0">✓ ${f}</li>`).join('')}
          </ul>
          ${cta(p, loggedIn, currentPlanId, stripeEnabled)}
        </div>
      `;
      }).join('');

      document.querySelectorAll('[data-checkout-plan]').forEach(btn => {
        btn.addEventListener('click', () => checkout(btn.dataset.checkoutPlan));
      });
    } catch (e) {
      document.getElementById('plans-grid').innerHTML = `<p class="muted">${I18N.t('pricing.loadError', 'Could not load plans')}</p>`;
    }
  }

  function cta(p, loggedIn, currentPlanId, stripeEnabled) {
    const btnStyle = 'width:100%;justify-content:center';

    if (loggedIn && p.id === currentPlanId) {
      return `<button class="btn btn-ghost" disabled style="${btnStyle}">${I18N.t('pricing.cta.currentPlan', 'Current plan')}</button>`;
    }
    if (p.id === 'free') {
      return loggedIn
        ? `<a class="btn btn-ghost" href="/billing" style="${btnStyle}">${I18N.t('pricing.cta.downgrade', 'Downgrade')}</a>`
        : `<a class="btn btn-ghost" href="/signup" style="${btnStyle}">${I18N.t('common.nav.getStartedShort', 'Get started')}</a>`;
    }
    if (!p.hasStripe || !stripeEnabled) {
      return `<a class="btn btn-ghost" href="/contact" style="${btnStyle}">${I18N.t('pricing.cta.contactSales', 'Contact sales')}</a>`;
    }
    if (loggedIn) {
      const label = currentPlanId && currentPlanId !== 'free' ? I18N.t('pricing.cta.switchPlan', 'Switch plan') : I18N.t('pricing.cta.upgrade', 'Upgrade');
      return `<button class="btn ${p.popular ? 'btn-primary' : 'btn-ghost'}" style="${btnStyle}" data-checkout-plan="${p.id}">${label} →</button>`;
    }
    return `<a class="btn ${p.popular ? 'btn-primary' : 'btn-ghost'}" href="/signup?plan=${p.id}" style="${btnStyle}">${I18N.t('pricing.cta.getStartedArrow', 'Get started →')}</a>`;
  }

  window.checkout = async (planId) => {
    const couponCode = document.getElementById('coupon-input')?.value.trim();
    try {
      if (couponCode) await API.validateCoupon(couponCode, planId);
      const { url } = await API.createCheckout(planId, couponCode);
      location.href = url;
    } catch (e) { toast(e.message, 'error'); }
  };

  load();
  </script>
</body>
</html>
