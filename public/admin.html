<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — AvatarPlatform</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('apTheme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div id="login-view" style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="width:100%;max-width:380px">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px">
        <span class="brand-mark">A</span>
        <span style="font-weight:700;font-size:15px">AvatarPlatform</span>
        <span class="pill" style="margin-inline-start:2px">Admin</span>
      </div>
      <h1 style="font-size:20px;margin:0 0 4px;text-align:center">Admin sign in</h1>
      <p class="muted text-sm text-center" style="margin:0 0 24px">Internal access only</p>
      <form id="login-form" class="col gap-md">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" required class="input" autofocus autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" required class="input" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
      </form>
    </div>
  </div>

  <div class="container mt-md">
    <div id="admin-view" hidden>
      <div class="page-header">
        <div>
          <h1 class="page-title">Admin</h1>
          <p class="page-sub" id="admin-whoami"></p>
        </div>
        <button class="btn btn-ghost" id="logout-btn">Log out</button>
      </div>

      <div class="row gap-sm mb-lg" id="tab-bar">
        <button class="btn btn-ghost tab-btn active" data-tab="overview">Overview</button>
        <button class="btn btn-ghost tab-btn" data-tab="users">Users</button>
        <button class="btn btn-ghost tab-btn" data-tab="billing">Billing</button>
        <button class="btn btn-ghost tab-btn" data-tab="characters">Characters</button>
        <button class="btn btn-ghost tab-btn" data-tab="coupons">Coupons</button>
        <button class="btn btn-ghost tab-btn" data-tab="tiers">Tiers</button>
        <button class="btn btn-ghost tab-btn" data-tab="audit">Audit Log</button>
        <button class="btn btn-ghost tab-btn" data-tab="status">Status</button>
      </div>

      <section id="tab-overview"></section>
      <section id="tab-users" hidden></section>
      <section id="tab-billing" hidden></section>
      <section id="tab-characters" hidden></section>
      <section id="tab-coupons" hidden></section>
      <section id="tab-tiers" hidden></section>
      <section id="tab-audit" hidden></section>
      <section id="tab-status" hidden></section>
    </div>
  </div>

  <div id="modal-root"></div>

  <!-- Same CDN builds public/embed.html and public/characters.html load —
       the character-upload inspector uses the real production Rive runtime
       so "does this file conform" reflects exactly what the widget will do. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/@rive-app/canvas@2.21.0/rive.js"></script>

  <script src="/js/theme.js"></script>
  <script src="/js/admin/core.js"></script>
  <script src="/js/admin/overview.js"></script>
  <script src="/js/admin/users.js"></script>
  <script src="/js/admin/billing.js"></script>
  <script src="/js/admin/characters.js"></script>
  <script src="/js/admin/coupons.js"></script>
  <script src="/js/admin/tiers.js"></script>
  <script src="/js/admin/audit.js"></script>
  <script src="/js/admin/status.js"></script>
</body>
</html>
