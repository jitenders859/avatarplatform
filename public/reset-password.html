<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="resetPassword.pageTitle">Set new password — AvatarPlatform</title>
  <meta name="description" content="Set a new password for your AvatarPlatform account." />
  <link rel="canonical" href="https://avatarplatform.ai/reset-password" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AvatarPlatform" />
  <meta property="og:title" content="Set new password — AvatarPlatform" />
  <meta property="og:description" content="Set a new password for your AvatarPlatform account." />
  <meta property="og:url" content="https://avatarplatform.ai/reset-password" />
  <meta property="og:image" content="https://avatarplatform.ai/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Set new password — AvatarPlatform" />
  <meta name="twitter:description" content="Set a new password for your AvatarPlatform account." />
  <meta name="twitter:image" content="https://avatarplatform.ai/og-image.png" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('apTheme') === 'dark' ? 'dark' : 'light';
    (function () {
      var RTL_LANGS = { ar: 1 };
      var KNOWN = ['en', 'es', 'fr', 'ar', 'hi'];
      var saved = localStorage.getItem('apLang');
      var lang = KNOWN.indexOf(saved) !== -1 ? saved : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = RTL_LANGS[lang] ? 'rtl' : 'ltr';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="lang-switch-slot" style="position:fixed;top:16px;inset-inline-end:16px;z-index:20"></div>
  <div id="theme-toggle-slot" style="position:fixed;top:16px;inset-inline-start:16px;z-index:20"></div>
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="width:100%;max-width:400px">
      <a class="brand" href="/" style="margin-bottom:24px;justify-content:center">
        <span class="brand-mark">AP</span>
        <span>AvatarPlatform</span>
      </a>
      <h1 style="font-size:22px;margin:0 0 4px;text-align:center" data-i18n="resetPassword.title">Set a new password</h1>
      <p class="muted text-sm text-center" style="margin:0 0 24px" data-i18n="resetPassword.subtitle">Choose a new password for your account</p>

      <div id="invalid-msg" style="display:none;text-align:center">
        <div style="font-size:36px;margin-bottom:16px">⚠️</div>
        <p style="margin:0 0 8px;font-weight:600" data-i18n="resetPassword.invalidTitle">Link invalid or expired</p>
        <p class="muted text-sm" style="margin:0 0 24px" data-i18n="resetPassword.invalidBody">Password reset links expire after 1 hour. Request a new one.</p>
        <a href="/forgot-password" class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="resetPassword.requestNew">Request new link</a>
      </div>

      <form id="reset-form" class="col gap-md">
        <div class="field">
          <label data-i18n="resetPassword.newPasswordLabel">New password</label>
          <input class="input" type="password" id="password" required autofocus autocomplete="new-password" />
          <span class="help" data-i18n="resetPassword.newPasswordHelp">Minimum 8 characters.</span>
        </div>
        <div class="field">
          <label data-i18n="resetPassword.confirmLabel">Confirm new password</label>
          <input class="input" type="password" id="confirm" required autocomplete="new-password" />
        </div>
        <div id="error" class="text-sm" style="color:var(--danger);display:none"></div>
        <button class="btn btn-primary btn-lg" type="submit" id="submit" data-i18n="resetPassword.submit">Set new password</button>
      </form>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/es.js"></script>
  <script src="/js/i18n/fr.js"></script>
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n/hi.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
  mountThemeToggle(document.getElementById('theme-toggle-slot'));
  I18N.init(document.getElementById('lang-switch-slot'));

  if (Auth.loggedIn()) location.href = '/dashboard';

  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('invalid-msg').style.display = 'block';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw  = document.getElementById('password').value;
    const con = document.getElementById('confirm').value;
    const err = document.getElementById('error');
    err.style.display = 'none';

    if (pw !== con) {
      err.textContent = I18N.t('resetPassword.mismatch', 'Passwords do not match');
      err.style.display = 'block';
      return;
    }

    const btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = I18N.t('resetPassword.saving', 'Saving…');
    try {
      await API.resetPassword(token, pw);
      // Short success message, then redirect to login
      btn.textContent = I18N.t('resetPassword.success', '✓ Password updated — redirecting…');
      setTimeout(() => location.href = '/login', 1500);
    } catch (e2) {
      if (e2.message.includes('invalid') || e2.message.includes('expired')) {
        document.getElementById('reset-form').style.display = 'none';
        document.getElementById('invalid-msg').style.display = 'block';
      } else {
        err.textContent = e2.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = I18N.t('resetPassword.submit', 'Set new password');
      }
    }
  });
  </script>
</body>
</html>
